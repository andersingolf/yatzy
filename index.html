function act(a){if(mode==='host')action(myid,a);else if(dc?.readyState==='open')dc.send(JSON.stringify({t:'action',...a}))}function render(){if(!state?.started)return;if(!state.finished){$('gameOver').classList.add('hidden');shownFinalRound=-1}else showGameOver();if(pendingScore&&(state.players[state.turn].id!==pendingScore.playerId||state.turn!==pendingScore.turn||state.rolls!==pendingScore.rolls))closeConfirm();$('lobby').classList.add('hidden');$('game').classList.remove('hidden');const turn=state.players[state.turn],mine=!state.finished&&turn.id===myid;$('status').textContent=state.finished?'🏆 Vinnare: '+state.players.filter(p=>total(p)===Math.max(...state.players.map(total))).map(p=>p.name).join(', '):'Tur: '+turn.name+(mine?' (du spelar)':'');const last=state.lastScore;const result=$('botResult');if(last?.bot){result.classList.add('visible');result.textContent=botDescription(last)+'!'}else{result.classList.remove('visible');result.textContent=''}const rollSignature=state.players[state.turn].id+'-'+state.rolls+'-'+state.dice.join('');const rolling=state.rolls>0&&rollSignature!==previousRollSignature;previousRollSignature=rollSignature;$('dice').innerHTML=state.dice.map((n,i)=>dieMarkup(n,i,state.held[i],!mine||state.rolls===0||state.rolls===3,rolling&&!state.held[i],state.rolls===0)).join('');animateDice();document.querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>act({kind:'hold',index:+b.dataset.die}));$('roll').disabled=!mine||state.rolls>=3;$('roll').textContent=mine?(state.rolls>=3?'Inga mer kast':state.rolls?'Kasta igen':'🎲 Kasta tärningarna'):'Väntar på '+turn.name;$('rolls').textContent=state.rolls+'/3 kast';if(rolling){clearTimeout(scoreRevealTimer);scoreRevealSignature='';clearTimeout(comboTimer);comboSignature=rollSignature;$('diceCombo').textContent='';const expected=rollSignature;comboTimer=setTimeout(()=>{if(comboSignature===expected&&state?.rolls>0&&state.players[state.turn].id+'-'+state.rolls+'-'+state.dice.join('')===expected){$('diceCombo').textContent=describeDice(state.dice);scoreRevealSignature=expected;document.querySelectorAll('[data-score]').forEach(b=>{b.textContent=score(+b.dataset.score,state.dice);b.disabled=false});$('chooseScore').style.display=state.players[state.turn].id===myid&&state.rolls>=3?'block':'none'}},2300)}else if(!state.rolls){scoreRevealSignature='';clearTimeout(comboTimer);comboSignature='';$('diceCombo').textContent=''}else if(comboSignature!==rollSignature){clearTimeout(comboTimer);comboSignature=rollSignature;scoreRevealSignature=rollSignature;$('diceCombo').textContent=describeDice(state.dice)}$('chooseScore').style.display=mine&&state.rolls>=3&&scoreRevealSignature===rollSignature?'block':'none';let h='<tr><th>Kategori</th>'+state.players.map((p,i)=>`<th class="${i===state.turn?'active':''}">${safe(p.name)}</th>`).join('')+'</tr>';for(let i=0;i<15;i++)h+='<tr><td>'+CATS[i]+'</td>'+state.players.map((p,j)=>{const v=p.scores[i];return `<td class="${last?.bot&&last.id===p.id&&last.category===i?'bot-scored':''}">${v!==null?v:(mine&&j===state.turn&&state.rolls?`<button data-score="${i}" ${scoreRevealSignature!==rollSignature?'disabled':''}>${scoreRevealSignature===rollSignature?score(i,state.dice):'…'}</button>`:'–')}</td>`}).join('')+'</tr>';h+='<tr><th>Övre summa</th>'+state.players.map(p=>'<th>'+p.scores.slice(0,6).reduce((a,b)=>a+(b||0),0)+'</th>').join('')+'</tr><tr><th>Bonus (63 ger 50)</th>'+state.players.map(p=>'<th>'+(p.scores.slice(0,6).reduce((a,b)=>a+(b||0),0)>=63?50:0)+'</th>').join('')+'</tr><tr><th>Totalt</th>'+state.players.map(p=>'<th>'+total(p)+'</th>').join('')+'</tr>';$('board').innerHTML=h;document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>chooseScore(+b.dataset.score))}function chooseScore(index){
 if(scoreRevealSignature!==state.players[state.turn].id+'-'+state.rolls+'-'+state.dice.join(''))return;
 if(!state?.started||state.finished||state.players[state.turn].id!==myid||state.rolls===0||state.players[state.turn].scores[index]!==null)return;
 pendingScore={index,playerId:myid,turn:state.turn,rolls:state.rolls};
 $('confirmChoice').textContent='Vill du sätta '+score(index,state.dice)+' poäng på '+CATS[index]+'?';
 $('scoreConfirm').classList.remove('hidden');
}
function closeConfirm(){$('scoreConfirm').classList.add('hidden');pendingScore=null}
$('confirmNo').addEventListener('click',closeConfirm);
$('confirmYes').addEventListener('click',()=>{
 const choice=pendingScore;closeConfirm();
 if(choice&&state?.started&&!state.finished&&state.turn===choice.turn&&state.players[state.turn].id===choice.playerId&&state.rolls===choice.rolls&&state.players[state.turn].scores[choice.index]===null)act({kind:'score',index:choice.index});
});
$('newRoundYes').addEventListener('click',()=>{
 if(!state?.finished)return;
 if(mode==='host')newRound();
 else if(dc?.readyState==='open'){$('newRoundInfo').textContent='Väntar på att värden startar nästa omgång…';dc.send(JSON.stringify({t:'action',kind:'newround'}))}
});
$('newRoundNo').addEventListener('click',()=>{$('gameOver').classList.add('hidden');shownFinalRound=state?.round||1});
$('roll').addEventListener('click',()=>act({kind:'roll'}));window.addEventListener('beforeunload',()=>{es?.close();pc?.close();peers.forEach(p=>p.pc.close())});})();
</script></body></html>
